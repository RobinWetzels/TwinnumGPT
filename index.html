<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <h1 id="botTitle"></h1>
        <p id="botTagline"></p>
      </div>
      <div class="actions">
        <button id="newChatBtn" class="btn" type="button">New chat</button>
        <button id="keyBtn" class="btn" type="button">API key</button>
        <button id="themeBtn" class="btn icon" type="button" aria-label="Toggle dark mode">🌓</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="starters" class="starters"></div>

    <form id="chatForm" class="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Type your message..."></textarea>
      <button id="sendBtn" class="send" type="submit">Send</button>
    </form>
  </div>

  <!-- API key pop-up -->
  <div id="keyModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
      <h2 id="keyTitle">Your Gemini API key</h2>
      <p class="small">
        Paste your key below. It is never saved in the website code.
        Get a free key at <strong>aistudio.google.com/apikey</strong>.
      </p>
      <input id="keyInput" type="password" placeholder="Paste API key here" autocomplete="off" />
      <label class="remember">
        <input id="rememberBox" type="checkbox" />
        Remember on this device
      </label>
      <p class="small">Leave unchecked on shared or school computers.</p>
      <div class="modal-actions">
        <button id="keyClear" class="btn" type="button">Remove key</button>
        <button id="keyCancel" class="btn" type="button">Cancel</button>
        <button id="keySave" class="btn primary" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
